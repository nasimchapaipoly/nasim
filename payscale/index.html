<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>National Pay Scale Calculation System by NasimSoft</title>
    
    <!-- Kalpurush Font CDN -->
    <link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4338CA;
            --primary-hover: #3730A3;
            --secondary: #0F172A;
            --success: #059669;
            --danger: #DC2626;
            --info: #0284C7;
            --bg: #F1F5F9;
            --surface: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Kalpurush', Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            padding: 30px 16px; 
            line-height: 1.6; 
            -webkit-font-smoothing: antialiased;
        }
        
        .container { max-width: 700px; margin: 0 auto; }
        
        .card { 
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            padding: 32px; 
            margin-bottom: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow-md); 
            position: relative;
            overflow: hidden;
        }
        
        .header { text-align: center; margin-bottom: 35px; }
        .header h1 { font-size: 1.8rem; color: var(--secondary); font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
        .header p { font-size: 1rem; color: var(--text-muted); }
        
        .counter-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); 
            color: var(--primary);
            padding: 8px 20px; border-radius: 9999px;
            font-size: 0.95rem; font-weight: 600; margin-top: 16px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.8);
        }

        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-size: 1.05rem; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        
        .form-control {
            width: 100%; padding: 14px 18px; border: 1.5px solid var(--border);
            border-radius: var(--radius-md); font-size: 1.05rem; outline: none; 
            background: #F8FAFC; transition: all 0.3s ease; color: var(--text-main);
            font-family: 'Kalpurush', Arial, sans-serif;
        }
        .form-control:focus { 
            background: var(--surface);
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(67, 56, 202, 0.15); 
        }

        .btn-submit {
            width: 100%; background: linear-gradient(135deg, var(--primary) 0%, #312E81 100%); 
            color: white; border: none;
            padding: 16px; border-radius: var(--radius-md); font-size: 1.2rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; margin-top: 10px;
            box-shadow: 0 4px 12px rgba(67, 56, 202, 0.3);
            font-family: 'Kalpurush', Arial, sans-serif;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(67, 56, 202, 0.4); }
        .btn-submit:active { transform: translateY(0); }

        .btn-print {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--surface); color: var(--text-main); 
            border: 1.5px solid var(--border); padding: 12px 24px; 
            border-radius: var(--radius-md); font-size: 1.1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; margin-top: 24px; width: 100%;
            font-family: 'Kalpurush', Arial, sans-serif;
        }
        .btn-print:hover { background: #F8FAFC; border-color: #CBD5E1; }

        .sec-title {
            font-size: 1.25rem; font-weight: 700; color: var(--secondary);
            border-bottom: 2px solid var(--border); padding-bottom: 10px; margin: 32px 0 16px;
        }
        .sec-title:first-child { margin-top: 0; }

        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; font-size: 1.05rem; border-bottom: 1px dashed var(--border);
            gap: 12px;
        }
        .item-row:last-child { border-bottom: none; }
        .item-row span:last-child { font-weight: 600; text-align: right; }
        .item-row.sub { color: var(--text-muted); font-size: 1rem; }
        
        .item-row.highlight {
            background: #ECFDF5; padding: 14px 18px; border-radius: var(--radius-md);
            color: var(--success); font-weight: 600; margin: 12px 0; border: none;
        }

        .stage-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 22px; margin-bottom: 16px;
            box-shadow: var(--shadow-sm); transition: transform 0.2s ease;
        }
        .stage-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stage-box.final { border: 1.5px solid #6EE7B7; background: linear-gradient(to bottom right, #F0FDF4, #FFFFFF); }
        .stage-box.info { border: 1.5px solid #BAE6FD; background: linear-gradient(to bottom right, #F0F9FF, #FFFFFF); }
        
        .stage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        
        .badge {
            background: var(--bg); color: var(--text-muted); padding: 6px 12px;
            border-radius: 8px; font-size: 0.9rem; font-weight: 600; border: 1px solid var(--border);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: white; width: 90%; max-width: 500px;
            border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg);
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-header { font-size: 1.4rem; font-weight: 700; color: var(--secondary); margin-bottom: 20px; text-align: center; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        .btn-cancel { flex: 1; background: #F1F5F9; color: var(--text-main); padding: 14px; border-radius: var(--radius-md); border: none; cursor: pointer; font-family: 'Kalpurush'; font-size: 1.1rem; font-weight: 600; }
        .btn-confirm { flex: 1; background: var(--primary); color: white; padding: 14px; border-radius: var(--radius-md); border: none; cursor: pointer; font-family: 'Kalpurush'; font-size: 1.1rem; font-weight: 600; box-shadow: 0 4px 12px rgba(67, 56, 202, 0.3); }

        .footer { text-align: center; margin-top: 40px; padding-top: 20px; font-size: 1rem; color: var(--text-muted); }
        .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        
        #result-view, .print-only { display: none; }

        /* Print Styles */
        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            body { background: white; padding: 0; color: black; font-size: 13pt; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            
            .print-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
            .print-header h1 { font-size: 20pt; margin-bottom: 5px; }
            .print-header p { font-size: 12pt; margin: 0; }
            
            .info-table, .data-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
            .info-table td { padding: 6px; border: none; font-size: 13pt; }
            
            .data-table th, .data-table td { border: 1px solid #000; padding: 10px; text-align: left; }
            .data-table th { background-color: #f2f2f2; font-weight: bold; }
            
            .signature-area { margin-top: 50px; display: flex; justify-content: space-between; }
            .signature-box { border-top: 1px solid #000; width: 200px; text-align: center; padding-top: 5px; }
        }

        @media (max-width: 480px) {
            .card { padding: 24px 16px; }
            .header h1 { font-size: 1.5rem; }
            .item-row { flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 0; }
            .item-row span:last-child { text-align: left; }
            .stage-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <div class="container">
        <div class="header">
            <h1>জাতীয় বেতনস্কেল ২০২৬ (প্রস্তাবিত)</h1>
            <p>২০২৬-২০২৮ সালের পর্যায়ক্রমিক বাস্তবায়ন পদ্ধতি অনুযায়ী পূর্ণাঙ্গ হিসাব</p>
            <div class="counter-badge" id="counter">🔥 হিসাব সম্পন্ন হয়েছে: <span id="calcCount">০</span> বার</div>
        </div>

        <div class="card">
            <form id="payForm" onsubmit="return calculatePay(event)">
                <div class="form-group">
                    <label>১. আপনার গ্রেড (১ হতে ২০):</label>
                    <select id="grade" class="form-control" required onchange="populateSteps()">
                        <option value="" disabled selected>গ্রেড নির্বাচন করুন</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>২. বর্তমান মূল বেতন (ধাপ নির্বাচন করুন):</label>
                    <select id="basic" class="form-control" required>
                        <option value="" disabled selected>প্রথমে গ্রেড নির্বাচন করুন</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>৩. কর্মস্থলের এলাকা (বাড়িভাড়ার জন্য):</label>
                    <select id="location" class="form-control">
                        <option value="DHAKA_City">ঢাকা সিটি কর্পোরেশন এলাকা</option>
                        <option value="OTHER_CITY">চট্টগ্রাম ও অন্যান্য সিটি কর্পোরেশন এলাকা</option>
                        <option value="DISTRICT">জেলা সদর পৌর এলাকা</option>
                        <option value="OTHER">অন্যান্য / উপজেলা / সাধারণ এলাকা</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>৪. সন্তানের সংখ্যা (শিক্ষা ভাতার জন্য, সর্বোচ্চ ২ জন):</label>
                    <input type="number" id="edu" class="form-control" value="0" min="0" max="2">
                </div>

                <div class="form-group">
                    <label>৫. মাসিক জিপিএফ (GPF) কর্তন (টাকা):</label>
                    <input type="number" id="gpf" class="form-control" placeholder="যেমন: ৫০০০" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>৬. মাসিক আয়কর কর্তন (টাকা):</label>
                    <input type="number" id="tax" class="form-control" placeholder="যেমন: ১০০০" value="0" min="0">
                </div>

                <button type="submit" class="btn-submit">📊 বিস্তারিত বেতন হিসাব করুন</button>
            </form>
        </div>

        <div class="card" id="result-view"></div>

        <div class="footer">
            © National Pay Scale Calculations 2026, Developed and Maintaining by <a href="https://nasim.ami.bd" target="_blank">NasimSoft</a>
        </div>
    </div>
</div>

<!-- Modal for Print Details -->
<div class="no-print modal-overlay" id="printModal">
    <div class="modal-content">
        <div class="modal-header">প্রিন্ট রিপোর্ট ইনফরমেশন</div>
        <form onsubmit="return executePrint(event)">
            <div class="form-group">
                <label>নাম (বাংলায়):</label>
                <input type="text" id="p_name" class="form-control" required placeholder="আপনার নাম লিখুন">
            </div>
            <div class="form-group">
                <label>বর্তমান পদবি (বাংলায়):</label>
                <input type="text" id="p_desig" class="form-control" required placeholder="আপনার পদবি লিখুন">
            </div>
            <div class="form-group">
                <label>বর্তমান কর্মস্থল (বাংলায়):</label>
                <input type="text" id="p_workplace" class="form-control" required placeholder="অফিসের নাম লিখুন">
            </div>
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="closePrintModal()">বাতিল</button>
                <button type="submit" class="btn-confirm">🖨️ প্রিন্ট করুন</button>
            </div>
        </form>
    </div>
</div>

<!-- Printable Area -->
<div class="print-only" id="print-area">
    <!-- Generated dynamically -->
</div>

<script>
// Data Configurations
const scale2015 = {
    1: [78000],
    2: [66000, 68480, 71050, 73720, 76490],
    3: [56500, 58760, 61120, 63570, 66120, 68770, 71530, 74400],
    4: [50000, 52000, 54080, 56250, 58500, 60840, 63280, 65820, 68460, 71200],
    5: [43000, 44940, 46970, 49090, 51300, 53610, 56030, 58560, 61200, 63960, 66840, 69850],
    6: [35500, 37280, 39150, 41110, 43170, 45330, 47600, 49980, 52480, 55110, 57870, 60770, 63810, 67010],
    7: [29000, 30450, 31980, 33580, 35260, 37030, 38890, 40840, 42890, 45040, 47300, 49670, 52160, 54770, 57510, 60390, 63410],
    8: [23000, 24150, 25360, 26630, 27970, 29370, 30840, 32390, 34010, 35720, 37510, 39390, 41360, 43430, 45610, 47900, 50300, 52820, 55470],
    9: [22000, 23100, 24260, 25480, 26760, 28100, 29510, 30990, 32540, 34170, 35880, 37680, 39570, 41550, 43630, 45820, 48120, 50530, 53060],
    10: [16000, 16800, 17640, 18530, 19460, 20440, 21470, 22550, 23680, 24870, 26120, 27430, 28810, 30260, 31780, 33370, 35040, 36800, 38640],
    11: [12500, 13130, 13790, 14480, 15210, 15980, 16780, 17620, 18510, 19440, 20420, 21450, 22530, 23660, 24850, 26100, 27410, 28790, 30230],
    12: [11300, 11870, 12470, 13100, 13760, 14450, 15180, 15940, 16740, 17580, 18460, 19390, 20360, 21380, 22450, 23580, 24760, 26000, 27300],
    13: [11000, 11550, 12130, 12740, 13380, 14050, 14760, 15500, 16280, 17100, 17960, 18860, 19810, 20810, 21860, 22960, 24110, 25320, 26590],
    14: [10200, 10710, 11250, 11820, 12420, 13050, 13710, 14400, 15120, 15880, 16680, 17520, 18400, 19320, 20290, 21310, 22380, 23500, 24680],
    15: [9700, 10190, 10700, 11240, 11810, 12410, 13040, 13700, 14390, 15110, 15870, 16670, 17510, 18390, 19310, 20280, 21300, 22370, 23490],
    16: [9300, 9770, 10260, 10780, 11320, 11890, 12490, 13120, 13780, 14470, 15200, 15960, 16760, 17600, 18480, 19410, 20390, 21410, 22490],
    17: [9000, 9450, 9930, 10430, 10960, 11510, 12090, 12700, 13340, 14010, 14720, 15460, 16240, 17060, 17920, 18820, 19770, 20760, 21800],
    18: [8800, 9240, 9710, 10200, 10710, 11250, 11820, 12420, 13050, 13710, 14400, 15120, 15880, 16680, 17520, 18400, 19320, 20290, 21310],
    19: [8500, 8930, 9380, 9850, 10350, 10870, 11420, 12000, 12600, 13230, 13900, 14600, 15330, 16100, 16910, 17760, 18650, 19590, 20570],
    20: [8250, 8670, 9110, 9570, 10050, 10560, 11090, 11650, 12240, 12860, 13510, 14190, 14900, 15650, 16440, 17270, 18140, 19050, 20010]
};

const scale2026Start = {
    1: 156000, 2: 132000, 3: 113000, 4: 100000, 5: 86000,
    6: 71000, 7: 58000, 8: 46000, 9: 44000, 10: 32000,
    11: 25000, 12: 24300, 13: 24000, 14: 23500, 15: 22800,
    16: 21900, 17: 21400, 18: 21000, 19: 20500, 20: 20000
};

const approxStep = {
    1: 2000, 2: 1500, 3: 1400, 4: 1200, 5: 1100,
    6: 1000, 7: 900, 8: 700, 9: 490, 10: 600,
    11: 500, 12: 400, 13: 400, 14: 350, 15: 300,
    16: 300, 17: 280, 18: 250, 19: 250, 20: 250
};

// State Object for Print
let appState = {};

function toBengaliNum(num) {
    const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return num.toString().replace(/[0-9]/g, match => bengaliDigits[match]);
}

window.onload = function() {
    const gradeSelect = document.getElementById('grade');
    for (let i = 1; i <= 20; i++) {
        let option = document.createElement('option');
        option.value = i; option.text = `গ্রেড ${toBengaliNum(i)}`;
        gradeSelect.add(option);
    }
    
    let count = parseInt(localStorage.getItem('payCalcCount') || '0');
    document.getElementById('calcCount').textContent = toBengaliNum(count);
};

function populateSteps() {
    const grade = document.getElementById('grade').value;
    const basicSelect = document.getElementById('basic');
    basicSelect.innerHTML = '<option value="" disabled selected>ধাপ নির্বাচন করুন</option>';
    
    if (grade && scale2015[grade]) {
        scale2015[grade].forEach((amount, index) => {
            let option = document.createElement('option');
            option.value = amount;
            option.text = `ধাপ ${toBengaliNum(index + 1)}: ${formatMoney(amount)}`;
            basicSelect.add(option);
        });
    }
}

function formatMoney(n) {
    let engFormat = Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return toBengaliNum(engFormat) + ' ৳';
}

function nextHigherStep(base, grade) {
    const start = scale2026Start[grade];
    if (Math.abs(base - start) < 1) return start;
    const step = approxStep[grade] || 500;
    let current = start;
    while (current < base - 0.5) {
        current += step;
    }
    return Math.round(current);
}

function getHouseRent(targetBasic, location) {
    let rate = 0.40, min = 7000;
    if (location === 'DHAKA_City') { rate = 0.55; min = 9600; }
    else if (location === 'OTHER_CITY') { rate = 0.45; min = 8000; }
    else if (location === 'DISTRICT') { rate = 0.40; min = 7000; }
    else { rate = 0.40; min = 7000; }
    return Math.max(targetBasic * rate, min);
}

function calculatePay(e) {
    e.preventDefault();

    const basic = parseFloat(document.getElementById('basic').value) || 0;
    const grade = parseInt(document.getElementById('grade').value) || 0;
    const location = document.getElementById('location').value;
    const eduCount = Math.min(2, Math.max(0, parseInt(document.getElementById('edu').value) || 0));
    const gpf = parseFloat(document.getElementById('gpf').value) || 0;
    const tax = parseFloat(document.getElementById('tax').value) || 0;

    if (grade < 1 || grade > 20 || basic < 5000) {
        alert('সঠিক গ্রেড (১-২০) ও মূল বেতন দিন।'); return false;
    }

    const start2015 = scale2015[grade][0];
    const start2026 = scale2026Start[grade];
    const earned = Math.max(0, basic - start2015);
    const baseAmount = start2026 + earned;
    const fixedBasic = nextHigherStep(baseAmount, grade);
    const totalIncrease = fixedBasic - basic;

    const welfare = 150, insurance = 100, stamp = 10;
    const totalDeduction = gpf + tax + welfare + insurance + stamp;

    const isPriority = grade >= 10;
    const stage1Pct = isPriority ? 0.50 : 0.40;
    const stage2Pct = isPriority ? 0.75 : 0.70;
    const p1Label = isPriority ? '৫০%' : '৪০%';
    const p2Label = isPriority ? '৭৫%' : '৭০%';

    const medical = 1500;
    const education = eduCount * 500;
    const oldHouseRent = getHouseRent(basic, location);
    const newHouseRent = getHouseRent(fixedBasic, location);
    
    const oldAllowances = oldHouseRent + medical + education;
    const newAllowances = newHouseRent + medical + education;
    
    const stage1Basic = basic + (totalIncrease * stage1Pct);
    const stage2Basic = basic + (totalIncrease * stage2Pct);
    const stage3Basic = fixedBasic; 
    const stage4Basic = fixedBasic;

    const stage1Net = (stage1Basic + oldAllowances) - totalDeduction;
    const stage2Net = (stage2Basic + oldAllowances) - totalDeduction;
    const stage3Net = (stage3Basic + oldAllowances) - totalDeduction;
    const stage4Net = (stage4Basic + newAllowances) - totalDeduction;
    const currentNet = (basic + oldAllowances) - totalDeduction;

    // Store state for printing
    appState = {
        grade, basic, start2015, earned, start2026, baseAmount, fixedBasic, totalIncrease,
        oldAllowances, newAllowances, totalDeduction,
        p1Label, p2Label, stage1Pct, stage2Pct,
        stage1Basic, stage2Basic, stage3Basic, stage4Basic,
        stage1Net, stage2Net, stage3Net, stage4Net, currentNet
    };

    let count = parseInt(localStorage.getItem('payCalcCount') || '0') + 1;
    localStorage.setItem('payCalcCount', count);
    document.getElementById('calcCount').textContent = toBengaliNum(count);

    const html = `
